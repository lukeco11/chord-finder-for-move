name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const expected = process.argv[1];
            for (const path of ["package.json", "src/module.json", "release.json"]) {
              const actual = JSON.parse(fs.readFileSync(path, "utf8")).version;
              if (actual !== expected) throw new Error(`${path} is ${actual}, tag is ${expected}`);
            }
          ' "$VERSION"
      - name: Build aarch64 module archive
        run: ./scripts/build.sh
      - name: Verify module
        run: npm test
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/chord-finder-module.tar.gz
